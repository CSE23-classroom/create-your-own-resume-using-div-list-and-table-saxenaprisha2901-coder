<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>

    <style>
        
        .container {
            width: 90%;
            margin: auto;
            padding: 10px;
        }

        
        .header {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: lightgray;
            padding: 20px;
            margin-bottom: 20px;
        }

        
        .side-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-weight: bold;
            color: gray;
            margin: 10px;
        }

        
        .grid-boxes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .small-box {
            background: rgb(200, 200, 200);
            height: 80px;
        }

        
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .big {
            background: gray;
            padding: 30px 0;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        
        .footer {
            background: lightgray;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

    </style>
</head>

<body>

<div class="container">

    <div style="display: flex; justify-content: space-between;">
        <div class="side-text">Background</div>

        <div style="flex: 1;">
            <div class="header">
                <div><b>Logo</b></div>
                <div style="text-align:right;"><b>Navigation</b></div>
            </div>

            
            <div class="grid-boxes">
                
                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>

                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>

                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>

                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>
            </div>

           
            <div class="bottom-row">
                <div class="big">Box 1</div>
                <div class="big">Box 2</div>
                <div class="big">Box 3</div>
            </div>

            
            <div class="footer">
                Footer
            </div>

        </div>

        <div class="side-text">Background</div>
    </div>

</div>

</body>
</html>
